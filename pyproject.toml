[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yt_dlp_plugins"]

[tool.hatch.build.targets.sdist]
only-include = [
  "/yt_dlp_plugins"
]

[project]
name = "yt-dlp-animepahe"
dynamic = ["version"]
description = 'Animepahe extractor plugin for yt-dlp'
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
keywords = []
authors = [{ name = "Asep5K", email = "Asep5K@proton.me" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]

dependencies = ["yt-dlp[default,curl-cffi]>=2025.12.08"]

[project.urls]
Documentation = "https://github.com/yt-dlp-plugins/yt-dlp-animepahe/blob/main/README.md"
Issues = "https://github.com/yt-dlp-plugins/yt-dlp-animepahe/issues"
Source = "https://github.com/yt-dlp-plugins/yt-dlp-animepahe"

[project.optional-dependencies]
static-analysis = ["ruff>=0.15.0"]

[tool.hatch.version]
path = "yt_dlp_plugins/extractor/animepahe/__init__.py"
pattern = "__version__ = '(?P<version>[^']+)'"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
  "RUF012",
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "double"
docstring-quotes = "double"
avoid-escape = false

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "off"
pythonVersion = "3.11"
